{% extends "chamados/base.html" %}
{% block content %}
<div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Gerenciar Tipos de Ocorrência</h2>
        <a href="{% url 'novo_tipo' %}" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-medium shadow-sm">+ Novo</a>
    </div>

    <form method="GET" class="mb-6 flex gap-2">
        <input type="text" name="q" value="{{ query }}" placeholder="Buscar tipo de ocorrência..." class="border border-gray-300 rounded p-2 flex-grow focus:ring-2 focus:ring-slate-500">
        <button type="submit" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded">Filtrar</button>
        {% if query %}<a href="{% url 'lista_tipos' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded">Limpar</a>{% endif %}
    </form>

    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="bg-gray-100 border-b-2 border-gray-200 text-gray-700">
                <th class="p-3 font-semibold">ID</th>
                <th class="p-3 font-semibold">Descrição</th>
                <th class="p-3 font-semibold text-right">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for tipo in tipos %}
            <tr class="border-b hover:bg-gray-50">
                <td class="p-3 text-gray-600">#{{ tipo.id }}</td>
                <td class="p-3">{{ tipo.descricao }}</td>
                <td class="p-3 text-right space-x-2">
                    <a href="{% url 'editar_tipo' tipo.id %}" class="text-blue-600 hover:underline">Editar</a>
                    <a href="{% url 'excluir_tipo' tipo.id %}" class="text-red-600 hover:underline">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="p-4 text-center text-gray-500">Nenhum tipo de ocorrência encontrado.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
