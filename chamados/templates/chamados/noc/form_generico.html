{% extends "chamados/base.html" %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-200 mt-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ titulo }}</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ form.descricao.label }}</label>
            {{ form.descricao }}
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t mt-6">
            <a href="{% url url_cancelar %}" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-gray-700">Cancelar</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
