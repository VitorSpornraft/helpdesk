{% extends "chamados/base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border border-red-200 mt-10 text-center">
    <h2 class="text-xl font-bold text-red-600 mb-4">Atenção!</h2>
    <p class="text-gray-700 mb-6">Tem certeza que deseja excluir o item <strong>"{{ item }}"</strong>?</p>
    <form method="POST" class="flex justify-center gap-4">
        {% csrf_token %}
        <a href="{% url url_cancelar %}" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-gray-700">Não, Cancelar</a>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded font-medium">Sim, Excluir</button>
    </form>
</div>
{% endblock %}
