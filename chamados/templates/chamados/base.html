<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    
    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            
            <div class="flex items-center space-x-8">
                <h1 class="text-xl font-bold border-r border-slate-600 pr-6">Portal de Chamados</h1>
                
                <div class="flex space-x-2">
                    <a href="{% url 'lista_chamados_solicitante' %}" class="text-slate-300 hover:text-white hover:bg-slate-700 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        Meus Chamados
                    </a>
                    
                    {% if request.user.perfilusuario.is_tecnico or request.user.perfilusuario.is_noc %}
                    <a href="{% url 'fila_chamados_tecnico' %}" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-md text-sm font-medium shadow transition-colors">
                        Fila de Atendimento
                    </a>
                    {% endif %}
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <span class="text-sm font-medium text-slate-300">Olá, {{ request.user.username }}</span>
            </div>
            
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
