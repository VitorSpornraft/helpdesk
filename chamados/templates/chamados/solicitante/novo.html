{% extends "chamados/base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-sm border-t-4 border-blue-600 mt-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Abrir Novo Chamado</h2>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1" for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>
            {{ field }}
            
            {% if field.help_text %}
            <span class="text-xs text-gray-500 mt-1">{{ field.help_text }}</span>
            {% endif %}
            
            {% for error in field.errors %}
            <span class="text-xs text-red-500 mt-1">{{ error }}</span>
            {% endfor %}
        </div>
        {% endfor %}

        <div class="flex justify-end gap-3 pt-4">
            <a href="{% url 'lista_chamados_solicitante' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded shadow-sm font-medium transition-colors">
                Cancelar
            </a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow-sm font-medium transition-colors">
                Salvar Chamado
            </button>
        </div>
    </form>
</div>

<script>
    document.querySelectorAll('input, select, textarea').forEach(function(el) {
        el.classList.add('border', 'border-gray-300', 'rounded-md', 'p-2', 'w-full', 'focus:outline-none', 'focus:ring-2', 'focus:ring-blue-500', 'bg-gray-50');
    });
</script>
{% endblock %}
